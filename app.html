    <script>
      // Apply the visitor's theme (shared with the portfolio) before first paint:
      // their saved DAY/NIGHT choice, else the system preference.
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('karl.theme')
        } catch (error) {
          // Storage can be unavailable; fall back to the system preference.
        }
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
