  /* tabs.height */
  --ds-tabs-height: var(--ds-size-control-md);

  /* tabs.padding */
  --ds-tabs-padding: var(--ds-space-inset-lg);

  /* tabs.gap */
  --ds-tabs-gap: var(--ds-space-inline-xs);

  /* tabs.fg */
  --ds-tabs-fg: var(--ds-color-text-muted);

  /* tabs.fg-hover */
  --ds-tabs-fg-hover: var(--ds-color-text-primary);

  /* tabs.fg-selected */
  --ds-tabs-fg-selected: var(--ds-color-text-primary);

  /* tabs.bg-hover */
  --ds-tabs-bg-hover: var(--ds-color-interactive-hover);

  /* tabs.bg-selected */
  --ds-tabs-bg-selected: var(--ds-color-interactive-selected);

  /* tabs.indicator */
  --ds-tabs-indicator: var(--ds-color-accent-default);

  /* tabs.indicator-width */
  --ds-tabs-indicator-width: var(--ds-border-width-strong);

  /* tabs.indicator-glow */
  --ds-tabs-indicator-glow: var(--ds-effect-glow-sm);

  /* tabs.border */
  --ds-tabs-border: var(--ds-color-border-subtle);

  /* tabs.radius */
  --ds-tabs-radius: var(--ds-radius-indicator);

  /* modal.bg */
  --ds-modal-bg: var(--ds-color-bg-surface);

  /* modal.fg */
  --ds-modal-fg: var(--ds-color-text-muted);

  /* modal.title */
  --ds-modal-title: var(--ds-color-text-primary);

  /* modal.border */
  --ds-modal-border: var(--ds-color-border-default);

  /* modal.border-top */
  --ds-modal-border-top: var(--ds-color-border-accent);

  /* modal.scrim */
  --ds-modal-scrim: var(--ds-color-bg-scrim);

  /* modal.shadow */
  --ds-modal-shadow: var(--ds-elevation-4);

  /* modal.radius */
  --ds-modal-radius: var(--ds-radius-surface);

  /* modal.padding */
  --ds-modal-padding: var(--ds-space-inset-xl);

  /* modal.gap */
  --ds-modal-gap: var(--ds-space-stack-md);

  /* modal.margin */
  --ds-modal-margin: var(--ds-space-layout-margin);

  /* modal.width */
  --ds-modal-width-sm: var(--ds-size-dialog-sm);
  --ds-modal-width-md: var(--ds-size-dialog-md);
  --ds-modal-width-lg: var(--ds-size-dialog-lg);

  /* modal.duration */
  --ds-modal-duration: var(--ds-motion-duration-moderate);

  /* modal.easing */
  --ds-modal-easing: var(--ds-motion-easing-enter);

  /* accordion.height */
  --ds-accordion-height: var(--ds-size-control-md);

  /* accordion.padding */
  --ds-accordion-padding: var(--ds-space-inset-md);

  /* accordion.fg */
  --ds-accordion-fg: var(--ds-color-text-primary);

  /* accordion.content-fg */
  --ds-accordion-content-fg: var(--ds-color-text-muted);

  /* accordion.icon */
  --ds-accordion-icon: var(--ds-color-text-accent);

  /* accordion.bg-hover */
  --ds-accordion-bg-hover: var(--ds-color-interactive-hover);

  /* accordion.border */
  --ds-accordion-border: var(--ds-color-border-subtle);

  /* accordion.duration */
  --ds-accordion-duration: var(--ds-motion-duration-moderate);

  /* accordion.easing */
  --ds-accordion-easing: var(--ds-motion-easing-standard);
}

@media (min-width: 1024px) {
  :root,
  [data-theme] {
    /* text.display */
    --ds-text-display-font-size: var(--ds-font-size-6xl);

    /* text.heading-1 */
    --ds-text-heading-1-font-size: var(--ds-font-size-5xl);
  }
}

/* Reduced motion: durations and lift collapse to zero. */
@media (prefers-reduced-motion: reduce) {
  :root {
    /* space.lift */
    --ds-space-lift: var(--ds-space-0);

    /* motion.duration */
    --ds-motion-duration-fast: var(--ds-duration-0);
    --ds-motion-duration-moderate: var(--ds-duration-0);
    --ds-motion-duration-slow: var(--ds-duration-0);
  }
}

[data-theme="dark"] { color-scheme: dark; }
[data-theme="light"] { color-scheme: light; }

/*
 * Design-system components (src/design-system/components). Every value is a
 * token: component tokens (--ds-<component>-*), semantic tokens or styles —
 * never a primitive or a raw colour / dimension. scripts/build-tokens.mjs
 * fails the build if that rule is broken.
 *
 * `data-ds-state="hover|active|focus"` forces a state for documentation
 * (the state matrices on the Design System page).
 */

/* ---------------------------------------------------------------- Icons */
.ds-icon {
  width: var(--ds-size-icon-sm);
  height: var(--ds-size-icon-sm);
  flex: none;
}

/* --------------------------------------------------------------- Button */
.ds-button {
  --_bg: var(--ds-button-primary-bg);
  --_bg-hover: var(--ds-button-primary-bg-hover);
  --_bg-active: var(--ds-button-primary-bg-active);
  --_fg: var(--ds-button-primary-fg);
  --_border: var(--ds-button-primary-border);
  --_shadow: var(--ds-button-primary-shadow);
  --_shadow-hover: var(--ds-button-primary-shadow-hover);
  position: relative;
  display: inline-flex;
  min-height: var(--ds-button-height-md);
  box-sizing: border-box;
  align-items: center;
  justify-content: center;
  gap: var(--ds-button-gap);
  padding: 0 var(--ds-button-padding-md);
  border: var(--ds-button-border-width) solid var(--_border);
  border-radius: var(--ds-button-radius);
  background: var(--_bg);
  box-shadow: var(--_shadow);
  color: var(--_fg);
  cursor: pointer;
  font: var(--ds-text-button-font);
  letter-spacing: var(--ds-text-button-letter-spacing);
  text-decoration: none;
  text-transform: var(--ds-text-button-text-case);
  white-space: nowrap;
  transition:
    transform var(--ds-button-duration) var(--ds-button-easing),
    box-shadow var(--ds-button-duration) var(--ds-button-easing),
    background-color var(--ds-button-duration) var(--ds-button-easing);
  -webkit-tap-highlight-color: transparent;
}

.ds-button--secondary {
  --_bg: var(--ds-button-secondary-bg);
  --_bg-hover: var(--ds-button-secondary-bg-hover);
  --_bg-active: var(--ds-button-secondary-bg-active);
  --_fg: var(--ds-button-secondary-fg);
  --_border: var(--ds-button-secondary-border);
  --_shadow: none;
  --_shadow-hover: none;
}

.ds-button--ghost {
  --_bg: var(--ds-button-ghost-bg);
  --_bg-hover: var(--ds-button-ghost-bg-hover);
  --_bg-active: var(--ds-button-ghost-bg-active);
  --_fg: var(--ds-button-ghost-fg);
  --_border: var(--ds-button-ghost-border);
  --_shadow: none;
  --_shadow-hover: none;
}

.ds-button--sm {
  min-height: var(--ds-button-height-sm);
  padding-inline: var(--ds-button-padding-sm);
}

.ds-button--lg {
  min-height: var(--ds-button-height-lg);
  padding-inline: var(--ds-button-padding-lg);
}

.ds-button--full {
  width: 100%;
}

/* Square icon-only button (needs an aria-label). */
.ds-button--icon {
  min-width: var(--ds-button-height-md);
  padding-inline: 0;
}

.ds-button--icon.ds-button--sm { min-width: var(--ds-button-height-sm); }
.ds-button--icon.ds-button--lg { min-width: var(--ds-button-height-lg); }

.ds-button:is(:hover, [data-ds-state="hover"]):not(:disabled, [aria-disabled="true"]) {
  background: var(--_bg-hover);
  box-shadow: var(--_shadow-hover);
  transform: translateY(calc(var(--ds-button-lift) * -1));
}

.ds-button:is(:active, [data-ds-state="active"]):not(:disabled, [aria-disabled="true"]) {
  background: var(--_bg-active);
  box-shadow: var(--_shadow);
  transform: none;
}

.ds-button:is(:focus-visible, [data-ds-state="focus"]) {
  outline: var(--ds-focus-ring);
  outline-offset: var(--ds-focus-offset);
}

.ds-button:is(:disabled, [aria-disabled="true"]) {
  box-shadow: none;
  cursor: not-allowed;
  opacity: var(--ds-button-disabled-opacity);
}

.ds-button[aria-busy="true"] {
  cursor: progress;
}

.ds-button__spinner {
  width: var(--ds-size-icon-sm);
  height: var(--ds-size-icon-sm);
  box-sizing: border-box;
  flex: none;
  border: var(--ds-border-width-strong) solid currentColor;
  border-right-color: transparent;
  border-radius: var(--ds-radius-pill);
  animation: ds-spin calc(var(--ds-motion-duration-slow) * 3) linear infinite;
}

@keyframes ds-spin {
  to { transform: rotate(1turn); }
}

/* ---------------------------------------------------------------- Input */
.ds-field {
  display: grid;
  gap: var(--ds-input-gap);
  min-width: 0;
}

.ds-field__label {
  color: var(--ds-input-label);
  font: var(--ds-text-heading-6-font);
  letter-spacing: var(--ds-text-heading-6-letter-spacing);
  text-transform: var(--ds-text-heading-6-text-case);
}

.ds-field__optional {
  color: var(--ds-input-hint);
  font-weight: var(--ds-text-label-font-weight);
  text-transform: none;
  letter-spacing: var(--ds-text-caption-letter-spacing);
}

.ds-input {
  width: 100%;
  min-height: var(--ds-input-height-md);
  box-sizing: border-box;
  margin: 0;
  padding: 0 var(--ds-input-padding);
  border: var(--ds-input-border-width) solid var(--ds-input-border);
  border-radius: var(--ds-input-radius);
  background: var(--ds-input-bg);
  color: var(--ds-input-fg);
  font: var(--ds-text-body-font);
  letter-spacing: var(--ds-text-body-letter-spacing);
  transition: border-color var(--ds-motion-duration-fast) var(--ds-motion-easing-standard);
}

.ds-input--sm {
  min-height: var(--ds-input-height-sm);
}

.ds-input::placeholder {
  color: var(--ds-input-placeholder);
  opacity: 1;
}

.ds-input:is(:hover, [data-ds-state="hover"]):not(:disabled, :focus) {
  border-color: var(--ds-input-border-hover);
}

.ds-input:is(:focus, [data-ds-state="focus"]) {
  border-color: var(--ds-input-border-focus);
  outline: var(--ds-focus-ring);
  outline-offset: 0;
}

.ds-input[aria-invalid="true"] {
  border-color: var(--ds-input-border-invalid);
}

.ds-input:disabled {
  background: var(--ds-input-bg-disabled);
  cursor: not-allowed;
  opacity: var(--ds-opacity-disabled);
}

.ds-input:read-only:not(:disabled) {
  border-style: dashed;
}

.ds-field__hint,
.ds-field__error {
  margin: 0;
  font: var(--ds-text-body-sm-font);
  letter-spacing: var(--ds-text-body-sm-letter-spacing);
}

.ds-field__hint {
  color: var(--ds-input-hint);
}

.ds-field__error {
  display: flex;
  align-items: flex-start;
  gap: var(--ds-space-inline-xs);
  color: var(--ds-input-error);
}

/* --------------------------------------------------------------- Switch */
.ds-switch {
  display: inline-flex;
  min-height: var(--ds-size-control-xs);
  align-items: center;
  gap: var(--ds-switch-gap);
  padding: 0;
  border: 0;
  background: none;
  color: var(--ds-switch-label);
  cursor: pointer;
  font: var(--ds-text-body-font);
  text-align: start;
  -webkit-tap-highlight-color: transparent;
}

.ds-switch__track {
  position: relative;
  width: var(--ds-switch-width);
  height: var(--ds-switch-height);
  box-sizing: border-box;
  flex: none;
  border: var(--ds-border-width-default) solid var(--ds-switch-border-off);
  border-radius: var(--ds-switch-radius);
  background: var(--ds-switch-track-off);
  transition:
    background-color var(--ds-switch-duration) var(--ds-switch-easing),
    border-color var(--ds-switch-duration) var(--ds-switch-easing);
}

.ds-switch__thumb {
  position: absolute;
  top: var(--ds-switch-inset);
  left: var(--ds-switch-inset);
  width: calc(var(--ds-switch-height) - 2 * var(--ds-switch-inset) - 2 * var(--ds-border-width-default));
  aspect-ratio: 1;
  border-radius: var(--ds-switch-radius);
  background: var(--ds-switch-thumb-off);
  transition:
    transform var(--ds-switch-duration) var(--ds-switch-easing),
    background-color var(--ds-switch-duration) var(--ds-switch-easing);
}

.ds-switch[aria-checked="true"] .ds-switch__track {
  border-color: var(--ds-switch-border-on);
  background: var(--ds-switch-track-on);
}

.ds-switch[aria-checked="true"] .ds-switch__thumb {
  background: var(--ds-switch-thumb-on);
  transform: translateX(calc(var(--ds-switch-width) - var(--ds-switch-height)));
}

.ds-switch:is(:hover, [data-ds-state="hover"]):not(:disabled) .ds-switch__track {
  border-color: var(--ds-color-border-strong);
}

.ds-switch[aria-checked="true"]:is(:hover, [data-ds-state="hover"]):not(:disabled) .ds-switch__track {
  border-color: var(--ds-color-accent-hover);
  background: var(--ds-color-accent-hover);
}

.ds-switch:is(:focus-visible, [data-ds-state="focus"]) {
  outline: var(--ds-focus-ring);
  outline-offset: var(--ds-focus-offset);
}

.ds-switch:disabled {
  cursor: not-allowed;
  opacity: var(--ds-opacity-disabled);
}

.ds-switch--label-start {
  flex-direction: row-reverse;
}

/* --------------------------------------------- Theme switch (DAY / NIGHT) */
/* Instrument-style selector: a status light and a sliding indicator.
   aria-checked="true" = NIGHT (dark theme). */
.ds-theme-switch {
  display: inline-flex;
  height: var(--ds-theme-switch-height);
  align-items: center;
  gap: var(--ds-theme-switch-gap);
  padding: 0;
  border: 0;
  background: none;
  color: var(--ds-theme-switch-text);
  cursor: pointer;
  font: var(--ds-theme-switch-font);
  letter-spacing: var(--ds-theme-switch-letter-spacing);
  -webkit-tap-highlight-color: transparent;
}

@media (pointer: coarse) {
  .ds-theme-switch {
    height: var(--ds-theme-switch-height-coarse);
    font-size: var(--ds-theme-switch-font-size-coarse);
  }
}

.ds-theme-switch__led {
  width: var(--ds-theme-switch-led-size);
  height: var(--ds-theme-switch-led-size);
  flex: none;
  border-radius: var(--ds-radius-pill);
  background: var(--ds-theme-switch-led);
  box-shadow: var(--ds-theme-switch-led-glow);
  transition: background-color var(--ds-motion-duration-slow) var(--ds-motion-easing-standard);
}

.ds-theme-switch__track {
  position: relative;
  display: grid;
  height: 100%;
  box-sizing: border-box;
  grid-template-columns: 1fr 1fr;
  overflow: hidden;
  border: var(--ds-border-width-default) solid var(--ds-theme-switch-border);
  border-radius: var(--ds-theme-switch-radius);
  background: var(--ds-theme-switch-bg);
  transition:
    border-color var(--ds-theme-switch-duration) var(--ds-motion-easing-standard),
    box-shadow var(--ds-theme-switch-duration) var(--ds-motion-easing-standard);
}

.ds-theme-switch__thumb {
  position: absolute;
  inset: var(--ds-theme-switch-inset) auto var(--ds-theme-switch-inset) var(--ds-theme-switch-inset);
  width: calc(50% - var(--ds-theme-switch-inset));
  border-radius: var(--ds-theme-switch-radius-inner);
  background: var(--ds-theme-switch-thumb);
  box-shadow: inset 0 0 0 var(--ds-border-width-default) var(--ds-theme-switch-border);
  transition: transform var(--ds-theme-switch-duration) var(--ds-theme-switch-easing);
}

.ds-theme-switch[aria-checked="true"] .ds-theme-switch__thumb {
  transform: translateX(100%);
}

.ds-theme-switch__option {
  position: relative;
  z-index: 1;
  display: grid;
  place-items: center;
  padding: 0 var(--ds-theme-switch-option-padding);
  transition: color var(--ds-theme-switch-duration) var(--ds-motion-easing-standard);
}

.ds-theme-switch[aria-checked="true"] .ds-theme-switch__option--night,
.ds-theme-switch[aria-checked="false"] .ds-theme-switch__option--day {
  color: var(--ds-theme-switch-text-selected);
  font-weight: var(--ds-text-button-font-weight);
}

.ds-theme-switch:is(:hover, [data-ds-state="hover"]) .ds-theme-switch__track {
  border-color: var(--ds-theme-switch-border-hover);
  box-shadow: var(--ds-theme-switch-glow-hover);
}

.ds-theme-switch:is(:active, [data-ds-state="active"]) .ds-theme-switch__thumb {
  box-shadow: inset 0 0 0 var(--ds-border-width-default) var(--ds-theme-switch-border-hover);
}

.ds-theme-switch:disabled {
  cursor: not-allowed;
  opacity: var(--ds-opacity-disabled);
}

.ds-theme-switch:is(:focus-visible, [data-ds-state="focus"]) {
  outline: var(--ds-focus-ring);
  outline-offset: var(--ds-focus-offset);
}

/* ----------------------------------------------------------------- Menu */
.ds-menu {
  position: relative;
  display: inline-block;
}

.ds-menu__trigger .ds-icon {
  transition: transform var(--ds-motion-duration-moderate) var(--ds-motion-easing-standard);
}

.ds-menu__trigger[aria-expanded="true"] .ds-icon {
  transform: rotate(180deg);
}

.ds-menu__list {
  position: absolute;
  z-index: var(--ds-menu-z);
  top: calc(100% + var(--ds-menu-offset));
  left: 0;
  display: grid;
  min-width: var(--ds-menu-min-width);
  box-sizing: border-box;
  margin: 0;
  padding: var(--ds-menu-padding);
  border: var(--ds-border-width-default) solid var(--ds-menu-border);
  border-top-color: var(--ds-menu-border-top);
  border-radius: var(--ds-menu-radius);
  background: var(--ds-menu-bg);
  box-shadow: var(--ds-menu-shadow);
  list-style: none;
}

.ds-menu__list[hidden] {
  display: none;
}

.ds-menu--end .ds-menu__list {
  right: 0;
  left: auto;
}

.ds-menu__item {
  position: relative;
  display: flex;
  width: 100%;
  min-height: var(--ds-menu-item-height);
  box-sizing: border-box;
  align-items: center;
  gap: var(--ds-space-inline-sm);
  padding: 0 var(--ds-menu-item-padding);
  border: 0;
  background: none;
  color: var(--ds-menu-item-fg);
  cursor: pointer;
  font: var(--ds-text-label-font);
  letter-spacing: var(--ds-text-label-letter-spacing);
  text-align: start;
  text-transform: var(--ds-text-label-text-case);
  white-space: nowrap;
}

.ds-menu__item:is(:hover, :focus, [data-ds-state="hover"], [data-ds-state="focus"]) {
  background: var(--ds-menu-item-bg-hover);
  color: var(--ds-menu-item-fg-hover);
}

.ds-menu__item:is(:focus-visible, [data-ds-state="focus"]) {
  outline: var(--ds-focus-ring);
  outline-offset: calc(var(--ds-focus-ring-width) * -1);
}

.ds-menu__item[aria-checked="true"] {
  background: var(--ds-menu-item-bg-selected);
  color: var(--ds-menu-item-fg-hover);
  font-weight: var(--ds-text-button-font-weight);
}

.ds-menu__item[aria-checked="true"]::before {
  position: absolute;
  inset: var(--ds-space-inset-sm) auto var(--ds-space-inset-sm) 0;
  width: var(--ds-border-width-strong);
  background: var(--ds-menu-item-indicator);
  box-shadow: var(--ds-effect-glow-sm);
  content: '';
}

.ds-menu__item--danger {
  color: var(--ds-menu-item-danger);
}

.ds-menu__item--danger:is(:hover, :focus, [data-ds-state]) {
  color: var(--ds-menu-item-danger);
}

.ds-menu__item[aria-disabled="true"] {
  cursor: not-allowed;
  opacity: var(--ds-opacity-disabled);
}

.ds-menu__item-hint {
  margin-left: auto;
  color: var(--ds-color-text-subtle);
  font: var(--ds-text-caption-font);
  letter-spacing: var(--ds-text-caption-letter-spacing);
  text-transform: none;
}

.ds-menu__separator {
  height: var(--ds-border-width-default);
  margin: var(--ds-space-inset-xs) 0;
  background: var(--ds-color-border-subtle);
}

/* ----------------------------------------------------------------- Card */
.ds-card {
  position: relative;
  display: flex;
  box-sizing: border-box;
  flex-direction: column;
  gap: var(--ds-card-gap);
  padding: var(--ds-card-padding-md);
  border: var(--ds-border-width-default) solid var(--ds-card-border);
  border-radius: var(--ds-card-radius);
  background: var(--ds-card-bg);
  color: var(--ds-card-fg);
  font: var(--ds-text-body-font);
  text-decoration: none;
}

.ds-card--sm { padding: var(--ds-card-padding-sm); }
.ds-card--lg { padding: var(--ds-card-padding-lg); }

.ds-card--raised {
  border-color: transparent;
  background: var(--ds-card-bg-raised);
  box-shadow: var(--ds-card-shadow-raised);
}

.ds-card--filled {
  border-color: transparent;
  background: var(--ds-color-bg-subtle);
}

.ds-card__eyebrow {
  margin: 0;
  color: var(--ds-card-eyebrow);
  font: var(--ds-text-overline-font);
  letter-spacing: var(--ds-text-overline-letter-spacing);
  text-transform: var(--ds-text-overline-text-case);
}

.ds-card__title {
  margin: 0;
  color: var(--ds-card-title);
  font: var(--ds-text-heading-4-font);
  letter-spacing: var(--ds-text-heading-4-letter-spacing);
}

.ds-card__body > :first-child { margin-top: 0; }
.ds-card__body > :last-child { margin-bottom: 0; }

.ds-card__footer {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--ds-space-inline-md);
  margin-top: auto;
  padding-top: var(--ds-space-stack-xs);
}

a.ds-card {
  cursor: pointer;
  transition:
    transform var(--ds-motion-duration-fast) var(--ds-motion-easing-standard),
    border-color var(--ds-motion-duration-fast) var(--ds-motion-easing-standard),
    box-shadow var(--ds-motion-duration-fast) var(--ds-motion-easing-standard);
}

a.ds-card:is(:hover, [data-ds-state="hover"]) {
  border-color: var(--ds-card-border-hover);
  box-shadow: var(--ds-card-shadow-hover);
  transform: translateY(calc(var(--ds-card-lift) * -1));
}

a.ds-card:is(:focus-visible, [data-ds-state="focus"]) {
  outline: var(--ds-focus-ring);
  outline-offset: var(--ds-focus-offset);
}

/* -------------------------------------------------------- Badge and tag */
.ds-badge {
  --_fg: var(--ds-badge-neutral-fg);
  --_bg: var(--ds-badge-neutral-bg);
  --_border: var(--ds-badge-neutral-border);
  --_solid: var(--ds-badge-neutral-solid);
  display: inline-flex;
  box-sizing: border-box;
  align-items: center;
  gap: var(--ds-badge-gap);
  padding: var(--ds-badge-padding-block) var(--ds-badge-padding-inline);
  border: var(--ds-border-width-default) solid var(--_border);
  border-radius: var(--ds-badge-radius);
  background: var(--_bg);
  color: var(--_fg);
  font: var(--ds-text-label-font);
  letter-spacing: var(--ds-text-label-letter-spacing);
  text-transform: var(--ds-text-label-text-case);
  vertical-align: middle;
  white-space: nowrap;
}

.ds-badge--accent { --_fg: var(--ds-badge-accent-fg); --_bg: var(--ds-badge-accent-bg); --_border: var(--ds-badge-accent-border); --_solid: var(--ds-badge-accent-solid); }
.ds-badge--success { --_fg: var(--ds-badge-success-fg); --_bg: var(--ds-badge-success-bg); --_border: var(--ds-badge-success-border); --_solid: var(--ds-badge-success-solid); }
.ds-badge--warning { --_fg: var(--ds-badge-warning-fg); --_bg: var(--ds-badge-warning-bg); --_border: var(--ds-badge-warning-border); --_solid: var(--ds-badge-warning-solid); }
.ds-badge--danger { --_fg: var(--ds-badge-danger-fg); --_bg: var(--ds-badge-danger-bg); --_border: var(--ds-badge-danger-border); --_solid: var(--ds-badge-danger-solid); }
.ds-badge--info { --_fg: var(--ds-badge-info-fg); --_bg: var(--ds-badge-info-bg); --_border: var(--ds-badge-info-border); --_solid: var(--ds-badge-info-solid); }

.ds-badge--solid {
  border-color: var(--_solid);
  background: var(--_solid);
  color: var(--ds-badge-solid-fg);
}

.ds-badge--outline {
  background: transparent;
}

.ds-badge--sm {
  padding-block: 0;
  font: var(--ds-text-caption-font);
  letter-spacing: var(--ds-text-label-letter-spacing);
}

.ds-badge__dot {
  width: var(--ds-size-indicator);
  height: var(--ds-size-indicator);
  flex: none;
  border-radius: var(--ds-radius-pill);
  background: currentColor;
  box-shadow: var(--ds-effect-glow-current);
}

.ds-tag {
  padding-block: 0;
  padding-inline-end: 0;
}

.ds-tag__remove {
  display: inline-grid;
  width: var(--ds-size-control-xs);
  height: var(--ds-size-control-xs);
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: var(--ds-badge-radius);
  background: none;
  color: inherit;
  cursor: pointer;
}

.ds-tag__remove:is(:hover, [data-ds-state="hover"]) {
  background: var(--ds-color-interactive-pressed);
}

.ds-tag__remove:focus-visible {
  outline: var(--ds-focus-ring);
  outline-offset: calc(var(--ds-focus-ring-width) * -1);
}

.ds-tag__remove .ds-icon {
  width: var(--ds-size-indicator);
  height: var(--ds-size-indicator);
}

/* -------------------------------------------------------------- Tooltip */
.ds-tooltip-anchor {
  position: relative;
  display: inline-flex;
}

.ds-tooltip {
  position: absolute;
  z-index: var(--ds-tooltip-z);
  bottom: calc(100% + var(--ds-tooltip-offset));
  left: 50%;
  width: max-content;
  max-width: var(--ds-tooltip-max-width);
  box-sizing: border-box;
  padding: var(--ds-tooltip-padding-block) var(--ds-tooltip-padding-inline);
  border-radius: var(--ds-tooltip-radius);
  background: var(--ds-tooltip-bg);
  box-shadow: var(--ds-tooltip-shadow);
  color: var(--ds-tooltip-fg);
  font: var(--ds-text-body-sm-font);
  letter-spacing: var(--ds-text-body-sm-letter-spacing);
  text-align: center;
  text-transform: none;
  transform: translateX(-50%);
  white-space: normal;
  animation: ds-fade-in var(--ds-tooltip-duration) var(--ds-motion-easing-enter);
}

.ds-tooltip[hidden] {
  display: none;
}

/* Arrow, and a bridge over the gap so the pointer can move onto the tooltip. */
.ds-tooltip::after {
  position: absolute;
  top: 100%;
  left: 50%;
  border: var(--ds-space-inset-xs) solid transparent;
  border-top-color: var(--ds-tooltip-bg);
  content: '';
  transform: translateX(-50%);
}

.ds-tooltip::before {
  position: absolute;
  inset: 100% 0 auto;
  height: var(--ds-tooltip-offset);
  content: '';
}

.ds-tooltip--bottom {
  top: calc(100% + var(--ds-tooltip-offset));
  bottom: auto;
}

.ds-tooltip--bottom::after {
  top: auto;
  bottom: 100%;
  border-top-color: transparent;
  border-bottom-color: var(--ds-tooltip-bg);
}

.ds-tooltip--bottom::before {
  inset: auto 0 100%;
}

@keyframes ds-fade-in {
  from { opacity: 0; }
}

/* ----------------------------------------------------------------- Tabs */
.ds-tabs {
  display: grid;
  gap: var(--ds-space-stack-lg);
  min-width: 0;
}

.ds-tabs__list {
  display: flex;
  gap: var(--ds-tabs-gap);
  overflow-x: auto;
  border-bottom: var(--ds-border-width-default) solid var(--ds-tabs-border);
  scrollbar-width: none;
}

.ds-tabs__list::-webkit-scrollbar {
  display: none;
}

.ds-tabs__tab {
  position: relative;
  display: inline-flex;
  min-height: var(--ds-tabs-height);
  flex: none;
  align-items: center;
  gap: var(--ds-space-inline-sm);
  padding: 0 var(--ds-tabs-padding);
  border: 0;
  background: none;
  color: var(--ds-tabs-fg);
  cursor: pointer;
  font: var(--ds-text-label-font);
  letter-spacing: var(--ds-text-label-letter-spacing);
  text-transform: var(--ds-text-label-text-case);
  white-space: nowrap;
  transition:
    color var(--ds-motion-duration-fast) var(--ds-motion-easing-standard),
    background-color var(--ds-motion-duration-fast) var(--ds-motion-easing-standard);
}

.ds-tabs__tab:is(:hover, [data-ds-state="hover"]):not(:disabled) {
  background: var(--ds-tabs-bg-hover);
  color: var(--ds-tabs-fg-hover);
}

.ds-tabs__tab[aria-selected="true"] {
  color: var(--ds-tabs-fg-selected);
  font-weight: var(--ds-text-button-font-weight);
}

.ds-tabs__tab[aria-selected="true"]::after {
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  height: var(--ds-tabs-indicator-width);
  background: var(--ds-tabs-indicator);
  box-shadow: var(--ds-tabs-indicator-glow);
  content: '';
}

.ds-tabs__tab:is(:focus-visible, [data-ds-state="focus"]) {
  outline: var(--ds-focus-ring);
  outline-offset: calc(var(--ds-focus-ring-width) * -1);
}

.ds-tabs__tab:disabled {
  cursor: not-allowed;
  opacity: var(--ds-opacity-disabled);
}

.ds-tabs--contained .ds-tabs__list {
  width: fit-content;
  max-width: 100%;
  box-sizing: border-box;
  padding: var(--ds-space-inset-xs);
  border: var(--ds-border-width-default) solid var(--ds-tabs-border);
  border-radius: var(--ds-tabs-radius);
  background: var(--ds-color-bg-subtle);
}

.ds-tabs--contained .ds-tabs__tab {
  border-radius: var(--ds-tabs-radius);
}

.ds-tabs--contained .ds-tabs__tab[aria-selected="true"] {
  background: var(--ds-tabs-bg-selected);
  box-shadow: inset 0 0 0 var(--ds-border-width-default) var(--ds-color-border-accent);
}

.ds-tabs--contained .ds-tabs__tab[aria-selected="true"]::after {
  content: none;
}

.ds-tabs__panel:focus-visible {
  outline: var(--ds-focus-ring);
  outline-offset: var(--ds-focus-offset);
}

/* ---------------------------------------------------------------- Modal */
.ds-modal {
  width: min(var(--ds-modal-width-md), calc(100% - 2 * var(--ds-modal-margin)));
  max-width: none;
  max-height: calc(100% - 2 * var(--ds-modal-margin));
  box-sizing: border-box;
  margin: auto;
  padding: 0;
  border: var(--ds-border-width-default) solid var(--ds-modal-border);
  border-top-color: var(--ds-modal-border-top);
  border-radius: var(--ds-modal-radius);
  background: var(--ds-modal-bg);
  box-shadow: var(--ds-modal-shadow);
  color: var(--ds-modal-fg);
  font: var(--ds-text-body-font);
  overflow: hidden;
}

.ds-modal--sm { width: min(var(--ds-modal-width-sm), calc(100% - 2 * var(--ds-modal-margin))); }
.ds-modal--lg { width: min(var(--ds-modal-width-lg), calc(100% - 2 * var(--ds-modal-margin))); }

.ds-modal[open] {
  display: flex;
  flex-direction: column;
  animation: ds-modal-in var(--ds-modal-duration) var(--ds-modal-easing);
}

.ds-modal::backdrop {
  background: var(--ds-modal-scrim);
}

@keyframes ds-modal-in {
  from {
    opacity: 0;
    transform: translateY(var(--ds-space-stack-xs));
  }
}

.ds-modal__inner {
  display: flex;
  min-height: 0;
  flex: 1 1 auto;
  flex-direction: column;
  gap: var(--ds-modal-gap);
  padding: var(--ds-modal-padding);
}

.ds-modal__header,
.ds-modal__footer {
  flex: none;
}

.ds-modal__header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--ds-space-inline-lg);
}

.ds-modal__title {
  margin: 0;
  color: var(--ds-modal-title);
  font: var(--ds-text-heading-4-font);
  letter-spacing: var(--ds-text-heading-4-letter-spacing);
}

.ds-modal__description {
  margin: var(--ds-space-stack-2xs) 0 0;
}

.ds-modal__body {
  min-height: 0;
  overflow-y: auto;
}

.ds-modal__body:focus-visible {
  outline: var(--ds-focus-ring);
  outline-offset: var(--ds-focus-offset);
}

.ds-modal__body > :first-child { margin-top: 0; }
.ds-modal__body > :last-child { margin-bottom: 0; }

.ds-modal__close {
  margin: calc(var(--ds-space-inset-md) * -1) calc(var(--ds-space-inset-md) * -1) 0 0;
}

.ds-modal__footer {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: var(--ds-space-inline-md);
}

:root:has(.ds-modal[open]) {
  overflow: hidden;
}

/* ------------------------------------------------------------ Accordion */
.ds-accordion {
  display: grid;
}

.ds-accordion__item + .ds-accordion__item {
  border-top: var(--ds-border-width-default) solid var(--ds-accordion-border);
}

.ds-accordion__heading {
  margin: 0;
  font: inherit;
}

.ds-accordion__trigger {
  display: flex;
  width: 100%;
  min-height: var(--ds-accordion-height);
  box-sizing: border-box;
  align-items: center;
  justify-content: space-between;
  gap: var(--ds-space-inline-md);
  padding: 0 var(--ds-accordion-padding);
  border: 0;
  background: none;
  color: var(--ds-accordion-fg);
  cursor: pointer;
  font: var(--ds-text-heading-6-font);
  letter-spacing: var(--ds-text-heading-6-letter-spacing);
  text-align: start;
  text-transform: var(--ds-text-heading-6-text-case);
}

.ds-accordion__trigger:is(:hover, [data-ds-state="hover"]) {
  background: var(--ds-accordion-bg-hover);
}

.ds-accordion__trigger:is(:focus-visible, [data-ds-state="focus"]) {
  outline: var(--ds-focus-ring);
  outline-offset: calc(var(--ds-focus-ring-width) * -1);
}

.ds-accordion__trigger:disabled {
  cursor: not-allowed;
  opacity: var(--ds-opacity-disabled);
}

.ds-accordion__icon {
  color: var(--ds-accordion-icon);
  transition: transform var(--ds-accordion-duration) var(--ds-accordion-easing);
}

.ds-accordion__trigger[aria-expanded="true"] .ds-accordion__icon {
  transform: rotate(180deg);
}

.ds-accordion__panel {
  padding: 0 var(--ds-accordion-padding) var(--ds-accordion-padding);
  color: var(--ds-accordion-content-fg);
  font: var(--ds-text-body-font);
}

.ds-accordion__panel[hidden] {
  display: none;
}

/*
 * The hero radar widget (scope, its own sample targets and yellow sector
 * polygon) is hidden so the canvas ASD is the only radar picture. It uses
 * visibility, not display: the element keeps its grid column and size, which
 * public/asd-scope.js measures to place the radar head, and its sweep keeps
 * rotating so the canvas sweep line can stay in sync with it.
 */
#top.asd-hero [aria-label="Animated radar display"] {
  visibility: hidden;
}

#top.asd-hero .animate-sweep {
  animation-duration: 145s;
}

#top.asd-hero {
  position: relative;
  width: 100%;
  max-width: none;
  isolation: isolate;
  overflow: hidden;
  padding-inline: max(1.25rem, calc((100vw - 1200px) / 2 + 1.25rem));
  background-color: #061b2c;
}

#top.asd-hero::before {
  position: absolute;
  z-index: 0;
  inset: -1px;
  pointer-events: none;
  content: '';
}

#top.asd-hero::before {
  background-image:
    radial-gradient(ellipse at 72% 44%, rgba(12, 104, 111, .2), transparent 56%),
    linear-gradient(rgba(42, 150, 174, .08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(42, 150, 174, .08) 1px, transparent 1px),
    repeating-linear-gradient(180deg, rgba(75, 210, 190, .025) 0 1px, transparent 1px 4px);
  background-size: auto, 40px 40px, 40px 40px, auto;
  /* --asd-grid: the "Grid" display slider (public/asd-scope.js), 0–1. */
  opacity: calc(.76 * var(--asd-grid, 1));
}

#top.asd-hero > div {
  position: relative;
  z-index: 1;
}

#top.asd-hero > .asd-map-layer {
  position: absolute;
  z-index: 0;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

/*
 * Back to top (public/back-to-top.js): instrument-style button with an
 * airliner that takes off to the top of the page.
 */
.asd-totop {
  --totop-size: 44px;
  --totop-bg: rgba(6, 27, 44, .9);
  --totop-line: #2f8f7c;
  --totop-plane: #43efbd;
  --totop-trail: rgba(67, 239, 189, .55);
  --totop-glow: rgba(67, 239, 189, .28);
  position: fixed;
  z-index: 60;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: max(16px, calc(env(safe-area-inset-bottom, 0px) + 12px));
  display: grid;
  width: var(--totop-size);
  height: var(--totop-size);
  place-items: center;
  padding: 0;
  border: 1px solid var(--totop-line);
  border-radius: 50%;
  background: var(--totop-bg);
  box-shadow: 0 4px 14px rgba(0, 0, 0, .35), inset 0 0 0 3px rgba(67, 239, 189, .06);
  color: var(--totop-plane);
  cursor: pointer;
  opacity: 0;
  visibility: hidden;
  transform: translateY(12px) scale(.9);
  transition: opacity .25s ease, transform .25s ease, visibility 0s linear .25s, border-color .2s ease, box-shadow .2s ease;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  -webkit-tap-highlight-color: transparent;
}

:root[data-theme="light"] .asd-totop {
  --totop-bg: rgba(255, 255, 255, .94);
  --totop-line: #5f8d9b;
  --totop-plane: #096b4a;
  --totop-trail: rgba(9, 107, 74, .45);
  --totop-glow: rgba(0, 93, 117, .2);
  box-shadow: 0 2px 10px rgba(23, 42, 53, .18), inset 0 0 0 3px rgba(0, 93, 117, .05);
}

.asd-totop.is-visible {
  opacity: 1;
  visibility: visible;
  transform: none;
  transition: opacity .25s ease, transform .25s ease, visibility 0s, border-color .2s ease, box-shadow .2s ease;
}

.asd-totop:hover {
  border-color: var(--totop-plane);
  box-shadow: 0 4px 14px rgba(0, 0, 0, .35), 0 0 0 4px var(--totop-glow);
}

.asd-totop:active {
  transform: scale(.94);
}

.asd-totop-craft {
  position: relative;
  display: grid;
  place-items: center;
  transition: transform .25s cubic-bezier(.3, .7, .2, 1), opacity .2s ease;
}

.asd-totop-plane {
  width: 22px;
  height: 22px;
  fill: currentColor;
  filter: drop-shadow(0 0 3px var(--totop-glow));
}

/* Contrails behind the wing tips. */
.asd-totop-trail {
  position: absolute;
  top: 15px;
  width: 1.5px;
  height: 5px;
  border-radius: 1px;
  background: linear-gradient(var(--totop-trail), transparent);
  transform-origin: top;
  transition: height .25s ease, opacity .25s ease;
  opacity: .7;
}

.asd-totop-trail--l { left: 4px; }
.asd-totop-trail--r { right: 4px; }

/* Hover: the plane climbs a little and the contrails stretch. */
.asd-totop:hover .asd-totop-craft {
  transform: translateY(-3px);
}

.asd-totop:hover .asd-totop-trail {
  height: 9px;
  opacity: 1;
}

/* After take-off the button's own plane has gone; it lands again on return. */
.asd-totop.is-launched .asd-totop-craft {
  opacity: 0;
  transform: translateY(-14px);
}

/* The plane that flies to the top of the screen. */
.asd-totop-flyer {
  position: fixed;
  z-index: 61;
  display: grid;
  width: 26px;
  height: 26px;
  place-items: center;
  color: var(--totop-plane, #43efbd);
  pointer-events: none;
  transform: translate(-50%, -50%);
  will-change: transform, opacity;
}

:root[data-theme="light"] .asd-totop-flyer {
  --totop-plane: #096b4a;
  --totop-trail: rgba(9, 107, 74, .45);
}

.asd-totop-flyer .asd-totop-plane {
  width: 26px;
  height: 26px;
  filter: drop-shadow(0 0 6px rgba(67, 239, 189, .55));
}

.asd-totop-flyer-trail {
  position: absolute;
  top: 70%;
  left: 50%;
  width: 2px;
  height: 0;
  border-radius: 1px;
  background: linear-gradient(var(--totop-trail, rgba(67, 239, 189, .55)), transparent);
  transform: translateX(-50%);
}

@media (pointer: coarse) {
  .asd-totop { --totop-size: 48px; }
}

@media (prefers-reduced-motion: reduce) {
  .asd-totop,
  .asd-totop.is-visible,
  .asd-totop-craft,
  .asd-totop-trail { transition: none; }
}

/* Hero intro: name + small Canadian flag (public/portfolio-runtime.js). */
.asd-intro-name {
  white-space: nowrap;
}

.asd-flag {
  display: inline-block;
  width: 1.5em;
  height: .75em;
  margin: 0 .05em 0 .45em;
  overflow: hidden;
  border-radius: 2px;
  vertical-align: .02em;
  /* Hairline frame so the white band reads on light backgrounds. */
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .22), 0 1px 3px rgba(0, 0, 0, .35);
}

:root[data-theme="light"] .asd-flag {
  box-shadow: 0 0 0 1px rgba(23, 42, 53, .22), 0 1px 2px rgba(23, 42, 53, .18);
}

/* Canvas air situation display, drawn by public/asd-scope.js. */
#top.asd-hero .asd-scope {
  display: block;
  width: 100%;
  height: 100%;
  /* Hidden until the default (Terrain) picture is complete, then fades in once. */
  opacity: 0;
  transition: opacity .7s ease;
}

#top.asd-hero .asd-map-layer.is-ready .asd-scope {
  opacity: 1;
}

@media (prefers-reduced-motion: reduce) {
  #top.asd-hero .asd-scope { transition: none; }
}

/*
 * Interactive hero map (public/map-viewport.js). Vertical swipes keep scrolling
 * the page; horizontal drags and pinches go to the map. A grab cursor shows
 * only over draggable map area (`asd-map-hover`, set by the viewport); text,
 * links and buttons keep the browser's normal cursors.
 */
#top.asd-hero.asd-map-ready {
  touch-action: pan-y;
}

#top.asd-hero.asd-map-hover {
  cursor: grab;
}

#top.asd-hero.asd-map-dragging,
#top.asd-hero.asd-map-dragging * {
  cursor: grabbing !important;
  user-select: none;
}

#top.asd-hero > .asd-map-layer:focus-visible {
  outline: 2px solid #47c9d5;
  outline-offset: -6px;
}

:root[data-theme="light"] #top.asd-hero > .asd-map-layer:focus-visible {
  outline-color: #005d75;
}

/* Map controls (public/map-controls.js), modelled on Google Maps' cluster. */
.asd-map-controls {
  --map-size: 32px;
  --map-surface: #0b2236;
  --map-border: rgba(80, 111, 131, .7);
  --map-icon: #b9cfdd;
  --map-icon-hover: #ffffff;
  --map-hover: #12314b;
  --map-active: #1a4262;
  --map-sep: rgba(159, 183, 204, .24);
  --map-accent: #43efbd;
  --map-focus: #47c9d5;
  --map-shadow: 0 1px 4px -1px rgba(0, 0, 0, .6);
  position: absolute;
  z-index: 3;
  right: 10px;
  bottom: 24px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
  cursor: default;
  touch-action: manipulation;
}

:root[data-theme="light"] .asd-map-controls {
  --map-surface: #ffffff;
  --map-border: transparent;
  --map-icon: #666666;
  --map-icon-hover: #333333;
  --map-hover: #f1f3f4;
  --map-active: #e8eaed;
  --map-sep: #e6e6e6;
  --map-accent: #1a73e8;
  --map-focus: #005d75;
  --map-shadow: 0 1px 4px -1px rgba(0, 0, 0, .3);
}

@media (pointer: coarse) {
  .asd-map-controls { --map-size: 40px; }
}

/* Out-rank `#top.asd-hero > div`, which makes hero children relative. */
#top.asd-hero > .asd-map-controls {
  position: absolute;
  z-index: 3;
}

/*
 * Two-column layouts: keep the cluster inside the first screen even when the
 * hero copy makes the hero taller than the viewport (the hero starts at the
 * top of the page). On phones it stays at the hero's bottom, by the radar.
 */
@media (min-width: 768px) {
  #top.asd-hero > .asd-map-controls {
    top: min(calc(100% - 24px), calc(100svh - 24px));
    bottom: auto;
    transform: translateY(-100%);
  }
}

#top.asd-hero > .asd-map-hint {
  position: absolute;
  z-index: 2;
}

.asd-map-btn {
  display: grid;
  width: var(--map-size);
  height: var(--map-size);
  flex: 0 0 auto;
  place-items: center;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--map-icon);
  cursor: pointer;
  transition: color .15s ease, background-color .15s ease;
}

.asd-map-btn svg {
  width: 18px;
  height: 18px;
}

.asd-map-btn:hover {
  background-color: var(--map-hover);
  color: var(--map-icon-hover);
}

.asd-map-btn:active {
  background-color: var(--map-active);
}

.asd-map-btn[aria-disabled="true"] {
  background-color: transparent;
  color: var(--map-icon);
  cursor: default;
  opacity: .38;
}

.asd-map-btn:focus-visible,
.asd-map-thumb:focus-visible {
  outline: 2px solid var(--map-focus) !important;
  outline-offset: -2px !important;
}

/*
 * Site-wide keyboard focus ring (WCAG 2.4.7, 1.4.11). Several Tailwind
 * components declared `focus-visible:outline-none` + a box-shadow ring that
 * never rendered, leaving filled buttons and the design-system tab panel with
 * no visible focus. One ring in the design system's --ring token, offset so it
 * sits on the page background: ≈10:1 in dark mode, ≈5.8:1 in light mode.
 */
:root[data-site="portfolio"] :is(a[href], button, [role="tab"], [role="tabpanel"], summary, input, select, textarea, [tabindex]:not([tabindex="-1"])):not(.asd-map-btn, .asd-map-thumb, .asd-map-layer):focus-visible {
  outline: 2px solid hsl(var(--ring)) !important;
  outline-offset: 3px !important;
}

.asd-map-locate,
.asd-map-zoom,
.asd-map-bar {
  border: 1px solid var(--map-border);
  background: var(--map-surface);
  box-shadow: var(--map-shadow);
}

.asd-map-locate {
  border-radius: 50%;
  color: var(--map-accent);
}

.asd-map-locate:hover {
  color: var(--map-accent);
}

.asd-map-zoom {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 8px;
}

.asd-map-sep {
  height: 1px;
  margin: 0 6px;
  background: var(--map-sep);
}

.asd-map-bar {
  display: flex;
  align-items: center;
  overflow: hidden;
  border-radius: 8px;
}

.asd-map-fullscreen:not(:last-child) {
  border-right: 1px solid var(--map-sep);
}

.asd-map-layers {
  display: flex;
  gap: 4px;
  padding: 0 6px;
}

.asd-map-thumb {
  width: 32px;
  height: 24px; /* WCAG 2.5.8 minimum target size */
  overflow: hidden;
  padding: 0;
  border: 2px solid transparent;
  border-radius: 4px;
  background: none;
  cursor: pointer;
  filter: saturate(.35);
  opacity: .55;
  transition: opacity .15s ease, filter .15s ease, border-color .15s ease;
}

.asd-map-thumb svg {
  display: block;
  width: 100%;
  height: 100%;
}

.asd-map-thumb:hover {
  opacity: .9;
}

.asd-map-thumb[aria-pressed="true"] {
  border-color: var(--map-accent);
  filter: none;
  opacity: 1;
}

.asd-map-more svg {
  transition: transform .2s ease;
}

.asd-map-more[aria-expanded="false"] svg {
  transform: rotate(180deg);
}

/*
 * Map style picker (public/map-layer-picker.js), modelled on Google Maps'
 * layer switcher: quick-toggle tile + hover/focus panel of rendered previews.
 */
.asd-layers {
  --layers-tile: 64px;
  --layers-surface: #0b2236;
  --layers-border: rgba(80, 111, 131, .7);
  --layers-sep: rgba(159, 183, 204, .24);
  --layers-text: #c4d6e2;
  --layers-strong: #ffffff;
  --layers-selected: #43efbd;
  --layers-hover: #12314b;
  --layers-shadow: 0 2px 10px rgba(0, 0, 0, .5);
  position: absolute;
  z-index: 3;
  left: 10px;
  bottom: 24px;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  cursor: default;
  touch-action: manipulation;
  font-family: 'Roboto Mono', ui-monospace, monospace;
}

:root[data-theme="light"] .asd-layers {
  --layers-surface: #ffffff;
  --layers-border: transparent;
  --layers-sep: #e6e6e6;
  --layers-text: #3c4043;
  --layers-strong: #202124;
  --layers-selected: #0b7a80;
  --layers-hover: #f1f3f4;
  --layers-shadow: 0 1px 4px rgba(0, 0, 0, .3);
}

/* Out-rank `#top.asd-hero > div`, which makes hero children relative. */
#top.asd-hero > .asd-layers {
  position: absolute;
  z-index: 3;
}

/* Two-column layouts: keep it inside the first screen, level with the zoom controls. */
@media (min-width: 768px) {
  #top.asd-hero > .asd-layers {
    top: min(calc(100% - 24px), calc(100svh - 24px));
    bottom: auto;
    transform: translateY(-100%);
  }
}

.asd-layers-tile {
  position: relative;
  flex: none;
  width: var(--layers-tile);
  height: var(--layers-tile);
  overflow: hidden;
  padding: 0;
  border: 2px solid var(--layers-surface);
  border-radius: 8px;
  background: linear-gradient(135deg, #12324a, #0b2a3d);
  box-shadow: var(--layers-shadow);
  cursor: pointer;
  transition: box-shadow .15s ease, transform .15s ease;
}

.asd-layers-tile:hover {
  box-shadow: 0 4px 14px rgba(0, 0, 0, .55);
  transform: translateY(-1px);
}

.asd-layers-tile:active {
  transform: none;
}

.asd-layers-img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.asd-layers-img.is-empty {
  visibility: hidden;
}

.asd-layers-tile-label {
  position: absolute;
  inset: auto 0 0;
  padding: 16px 3px 5px;
  background: linear-gradient(to top, rgba(0, 0, 0, .82) 52%, rgba(0, 0, 0, 0));
  color: #ffffff;
  font: 700 10px/1.15 'Roboto Mono', ui-monospace, monospace;
  letter-spacing: .02em;
  text-align: center;
}

.asd-layers-panel {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 2px;
  max-width: calc(100vw - var(--layers-tile) - 40px);
  padding: 8px 6px 6px;
  border: 1px solid var(--layers-border);
  border-radius: 8px;
  background: var(--layers-surface);
  box-shadow: var(--layers-shadow);
  opacity: 0;
  visibility: hidden;
  transform: translateX(-6px);
  transition: opacity .16s ease, transform .16s ease, visibility 0s linear .16s;
}

.asd-layers.is-open .asd-layers-panel {
  opacity: 1;
  visibility: visible;
  transform: none;
  transition: opacity .16s ease, transform .16s ease, visibility 0s;
}

.asd-layers-option,
.asd-layers-detail {
  display: grid;
  justify-items: center;
  align-content: start;
  gap: 4px;
  min-width: 62px;
  padding: 2px 2px 4px;
  border: 0;
  border-radius: 6px;
  background: none;
  color: var(--layers-text);
  cursor: pointer;
  font: 500 11px/1.2 'Roboto Mono', ui-monospace, monospace;
}

.asd-layers-thumb {
  display: block;
  width: 48px;
  height: 48px;
  overflow: hidden;
  border: 2px solid transparent;
  border-radius: 8px;
  background: linear-gradient(135deg, #12324a, #0b2a3d);
  box-shadow: 0 0 0 1px var(--layers-sep);
  transition: border-color .15s ease;
}

.asd-layers-option:hover .asd-layers-thumb,
.asd-layers-detail:hover .asd-layers-thumb {
  border-color: var(--layers-text);
}

.asd-layers-option:hover .asd-layers-name,
.asd-layers-detail:hover .asd-layers-name {
  color: var(--layers-strong);
}

.asd-layers-option[aria-pressed="true"] .asd-layers-thumb,
.asd-layers-detail[aria-pressed="true"] .asd-layers-thumb,
.asd-layers-more[aria-expanded="true"] .asd-layers-thumb {
  border-color: var(--layers-selected);
}

.asd-layers-option[aria-pressed="true"] .asd-layers-name,
.asd-layers-detail[aria-pressed="true"] .asd-layers-name {
  color: var(--layers-selected);
  font-weight: 700;
}

.asd-layers-name {
  max-width: 78px;
  text-align: center;
  transition: color .15s ease;
}

.asd-layers-divider {
  align-self: stretch;
  width: 1px;
  margin: 4px 3px 18px;
  background: var(--layers-sep);
}

.asd-layers-thumb--icon {
  display: grid;
  place-items: center;
  background: var(--layers-hover);
  color: var(--layers-text);
}

.asd-layers-thumb--icon svg {
  width: 22px;
  height: 22px;
}

.asd-layers-popover {
  position: absolute;
  left: 0;
  bottom: calc(100% + 8px);
  width: min(330px, calc(100vw - 20px));
  padding: 10px 12px 12px;
  border: 1px solid var(--layers-border);
  border-radius: 8px;
  background: var(--layers-surface);
  box-shadow: var(--layers-shadow);
}

.asd-layers-details-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.asd-layers-details-title {
  margin: 0;
  color: var(--layers-strong);
  font: 700 11px/1.2 'Roboto Mono', ui-monospace, monospace;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.asd-layers-close {
  display: grid;
  width: 32px;
  height: 32px;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: none;
  color: var(--layers-text);
  cursor: pointer;
}

.asd-layers-close:hover {
  background: var(--layers-hover);
  color: var(--layers-strong);
}

.asd-layers-close svg {
  width: 18px;
  height: 18px;
}

.asd-layers-details-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px 4px;
}

.asd-layers-thumb--detail {
  width: 56px;
  height: 40px;
}

.asd-layers-thumb--detail svg {
  display: block;
  width: 100%;
  height: 100%;
}

/* Display adjustments (Adjust → Display): continuous sliders. */
.asd-layers-display {
  width: min(300px, calc(100vw - 20px));
}

.asd-adjust-list {
  display: grid;
  gap: 10px;
}

.asd-adjust-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}

.asd-adjust-label {
  color: var(--layers-strong);
  font: 600 11px/1.3 'Roboto Mono', ui-monospace, monospace;
  letter-spacing: .04em;
}

.asd-adjust-value {
  color: var(--layers-selected);
  font: 700 11px/1.3 'Roboto Mono', ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
}

.asd-adjust-hint {
  margin: 0;
  color: var(--layers-text);
  font: 400 10px/1.35 'Roboto Mono', ui-monospace, monospace;
}

.asd-adjust-range {
  --fill: 100%;
  --track: var(--layers-sep);
  display: block;
  width: 100%;
  height: 24px; /* WCAG 2.5.8 target height */
  margin: 2px 0 0;
  background: transparent;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
}

.asd-adjust-range::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--layers-selected) var(--fill), var(--track) var(--fill));
}

.asd-adjust-range::-moz-range-track {
  height: 4px;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--layers-selected) var(--fill), var(--track) var(--fill));
}

.asd-adjust-range::-webkit-slider-thumb {
  width: 18px;
  height: 18px;
  margin-top: -7px;
  border: 2px solid var(--layers-surface);
  border-radius: 50%;
  background: var(--layers-selected);
  box-shadow: 0 0 0 1px var(--layers-selected), 0 1px 3px rgba(0, 0, 0, .4);
  appearance: none;
  -webkit-appearance: none;
  transition: transform .12s ease;
}

.asd-adjust-range::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border: 2px solid var(--layers-surface);
  border-radius: 50%;
  background: var(--layers-selected);
  box-shadow: 0 0 0 1px var(--layers-selected), 0 1px 3px rgba(0, 0, 0, .4);
}

.asd-adjust-range:hover::-webkit-slider-thumb,
.asd-adjust-range:active::-webkit-slider-thumb {
  transform: scale(1.12);
}

/* Unfilled track must stay visible against the popover (WCAG 1.4.11). */
:root[data-theme="light"] .asd-adjust-range {
  --track: #7a8c98;
}

:root:not([data-theme="light"]) .asd-adjust-range {
  --track: #5c7d91;
}

.asd-adjust-foot {
  display: flex;
  justify-content: flex-end;
  margin-top: 10px;
}

.asd-adjust-reset {
  min-height: 32px;
  padding: 0 14px;
  border: 1px solid var(--layers-selected);
  border-radius: 16px;
  background: none;
  color: var(--layers-selected);
  cursor: pointer;
  font: 700 11px/1 'Roboto Mono', ui-monospace, monospace;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.asd-adjust-reset:hover {
  background: var(--layers-hover);
}

@media (prefers-reduced-motion: reduce) {
  .asd-adjust-range::-webkit-slider-thumb { transition: none; }
}

@media (prefers-reduced-motion: reduce) {
  .asd-layers-tile,
  .asd-layers-panel,
  .asd-layers.is-open .asd-layers-panel,
  .asd-layers-thumb,
  .asd-layers-name { transition: none; }
}

/* Cooperative-scroll hint ("Use Ctrl + scroll to zoom the map"). */
.asd-map-hint {
  position: absolute;
  z-index: 2;
  inset: 0;
  display: grid;
  place-items: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity .3s ease;
}

.asd-map-hint span {
  padding: .7rem 1.1rem;
  border-radius: 6px;
  background: rgba(0, 0, 0, .7);
  color: #ffffff;
  font: 500 .875rem/1.4 'Roboto Mono', ui-monospace, monospace;
}

.asd-map-hint.is-visible {
  opacity: 1;
}

@media (prefers-reduced-motion: reduce) {
  .asd-map-btn,
  .asd-map-thumb,
  .asd-map-more svg,
  .asd-map-hint { transition: none; }
}

nav[aria-label="Primary"] > ul {
  scrollbar-width: none;
  -ms-overflow-style: none;
}

nav[aria-label="Primary"] ul::-webkit-scrollbar,
nav[aria-label="Primary"] ul::-webkit-scrollbar-button {
  display: none;
  width: 0;
  height: 0;
}

/* Entry gate (public/disclaimer.js): the disclaimer dialog. */
.km-gate-kicker {
  margin: 0 0 var(--ds-space-stack-2xs);
  color: var(--ds-color-text-accent);
  font: var(--ds-text-overline-font);
  letter-spacing: var(--ds-text-overline-letter-spacing);
  text-transform: uppercase;
}

.km-gate .ds-modal__title {
  font: var(--ds-text-heading-3-font);
  letter-spacing: var(--ds-text-heading-3-letter-spacing);
}

.km-gate .ds-modal__title:focus {
  outline: none;
}

.km-gate-body {
  padding-right: var(--ds-space-inset-xs);
  font: var(--ds-text-body-sm-font);
  line-height: var(--ds-font-line-height-relaxed);
}

.km-gate-body p {
  margin: 0 0 var(--ds-space-stack-sm);
}

.km-gate-form {
  display: grid;
  flex: none;
  gap: var(--ds-space-stack-md);
  padding-top: var(--ds-space-stack-md);
  border-top: var(--ds-border-width-default) solid var(--ds-color-border-subtle);
}

.km-gate-form .ds-field__error[hidden] {
  display: none;
}

.km-gate-notice strong {
  color: var(--ds-color-text-primary);
}

/* Portfolio Demonstration Disclaimer (homepage footer). */
.km-disclaimer {
  max-width: var(--ds-size-container-prose);
  margin-top: 5rem;
  padding-top: var(--ds-space-stack-lg);
  border-top: var(--ds-border-width-default) solid var(--ds-color-border-subtle);
  font-family: var(--ds-font-family-mono);
}

.km-disclaimer-title {
  margin: 0;
  color: var(--ds-color-text-accent);
  font: var(--ds-text-overline-font);
  letter-spacing: var(--ds-text-overline-letter-spacing);
  text-transform: uppercase;
}

.km-disclaimer-text {
  margin: var(--ds-space-stack-sm) 0 0;
  color: var(--ds-color-text-muted);
  font: var(--ds-text-body-sm-font);
  line-height: var(--ds-font-line-height-relaxed);
}

.km-disclaimer-title + .km-disclaimer-text {
  margin-top: var(--ds-space-stack-xs);
}

.km-disclaimer-notice strong {
  color: var(--ds-color-text-primary);
}

.km-disclaimer-legal {
  margin: var(--ds-space-stack-lg) 0 0;
  color: var(--ds-color-text-muted);
  font: var(--ds-text-caption-font);
  letter-spacing: var(--ds-font-tracking-wide-6);
  text-transform: uppercase;
}

section[id],
footer[id] {
  scroll-margin-top: 70px;
}

@media (prefers-reduced-motion: reduce) {
  #top.asd-hero .animate-sweep { animation: none !important; }
}

.uiux-page {
  position: relative;
  isolation: isolate;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: clip;
  background-color: var(--uiux-bg);
  --uiux-bg: #061b2c;
  --uiux-grid: rgba(42, 150, 174, .08);
  --uiux-glow: rgba(12, 104, 111, .2);
  --uiux-scan: rgba(75, 210, 190, .025);
  --uiux-sweep: rgba(50, 232, 179, .1);
  --uiux-border: #52778c;
  --uiux-fg: #dceaf3;
  --uiux-muted: #9fb7cc;
  --uiux-accent: #43efbd;
  --uiux-focus: #47c9d5;
}

/*
 * Site header for the app pages (src/components/site/SiteHeader.tsx): the
 * homepage header's exact values. Layout rules are shared with the homepage
 * through nav[aria-label="Primary"] (see "Shared header layout" below).
 */
/* Site colour tokens: aliases of the design system's semantic layer
   (src/design-system/tokens/semantic.json), so the light / dark values live in
   one place. Shared by the homepage header, the app header and its menus. */
:root {
  --km-bg: var(--ds-color-bg-canvas);
  --km-surface: var(--ds-color-bg-surface);
  --km-fg: var(--ds-color-text-primary);
  --km-muted: var(--ds-color-text-muted);
  --km-ok: var(--ds-color-accent-default);
  --km-ok-fg: var(--ds-color-text-on-accent);
  --km-ring: var(--ds-color-focus-ring);
  --km-alert: var(--ds-color-status-danger);
  --km-line: var(--ds-color-border-default);
  --km-solid: var(--ds-color-bg-overlay);
}

.km-header {
  position: sticky;
  top: 0;
  z-index: 40;
  margin-bottom: -65px;
  border-bottom: 1px solid transparent;
  background: transparent;
  font-family: "Roboto Mono", ui-monospace, monospace;
  transition: background-color .3s ease, border-color .3s ease;
}

/* Scrolled: solid backdrop and a status-green rule, as on the homepage. */
.km-header.is-scrolled {
  border-bottom-color: var(--km-ok);
  background: var(--km-solid);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}

.km-header nav {
  display: grid;
  max-width: 1200px;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 16px;
  margin: 0 auto;
  padding: 20px;
}

@media (min-width: 768px) {
  .km-header nav { grid-template-columns: 1fr auto 1fr; }
}

.km-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--km-fg);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .1em;
  text-decoration: none;
}

.km-logo-dot {
  width: 10px;
  height: 10px;
  border-radius: 9999px;
  background: var(--km-ok);
  box-shadow: 0 0 10px var(--km-ok);
}

.km-links {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin: 0;
  padding: 0;
  color: var(--km-muted);
  font-size: 11px;
  letter-spacing: .2em;
  list-style: none;
  text-transform: uppercase;
}

.km-links > li > a {
  position: relative;
  padding: 4px 0;
  color: inherit;
  text-decoration: none;
  white-space: nowrap;
  transition: color .15s ease;
}

.km-links > li > a:hover,
.km-links > li > a[aria-current],
.km-links > li > a.is-section {
  color: var(--km-fg);
}

.km-links > li > a span {
  margin-right: 6px;
  color: var(--km-ok);
}

/* Active section: the homepage's glowing underline. */
.km-links > li > a[aria-current]::after,
.km-links > li > a.is-section::after {
  position: absolute;
  inset: auto 0 -4px;
  height: 1px;
  background: var(--km-ok);
  box-shadow: 0 0 8px var(--km-ok);
  content: '';
}

.km-utc {
  display: none;
  justify-self: end;
  color: var(--km-muted);
  font-size: 11px;
  letter-spacing: .2em;
}

.km-utc span {
  color: var(--km-ok);
}

@media (min-width: 768px) {
  .km-utc { display: block; }
}

.km-header :is(a, button):focus-visible {
  outline: 2px solid var(--km-ring);
  outline-offset: 3px;
}

/* Session bar (UI/UX page): sits under the header, so the header row stays
   identical to the homepage; Sign out uses the homepage outline button. */
.km-session {
  position: relative;
  display: flex;
  max-width: 1200px;
  box-sizing: border-box;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: 12px 20px;
  margin: 0 auto;
  /* The header overlaps the page by its first 65px (margin-bottom: -65px). */
  padding: calc(65px + 16px) 20px 0;
  font-family: "Roboto Mono", ui-monospace, monospace;
}

.km-session-status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  color: var(--km-muted);
  font-size: 11px;
  letter-spacing: .2em;
  text-transform: uppercase;
}

.km-session-status strong {
  color: var(--km-fg);
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: none;
}

.km-session-led {
  width: 6px;
  height: 6px;
  border-radius: 9999px;
  background: var(--km-ok);
  box-shadow: 0 0 8px var(--km-ok);
}

/* Short app pages keep the homepage's scrollbar gutter, so the header never
   shifts sideways between pages. */
html {
  scrollbar-gutter: stable;
}

/*
 * UI/UX sub-menu ("06 UI/UX" → Design System, Style Guide). React:
 * src/components/site/UiuxNavItem.tsx; homepage: public/portfolio-runtime.js.
 * A dropdown panel on desktop, an expandable indented list at ≤720px.
 */
.km-nav-group {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 2px;
}

.km-nav-toggle {
  display: inline-grid;
  width: 24px;
  height: 24px;
  place-items: center;
  margin-right: -4px;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 3px;
  background: transparent;
  color: var(--km-ok);
  cursor: pointer;
  transition: border-color .15s ease, background-color .15s ease;
}

.km-nav-toggle svg {
  transition: transform .2s ease;
}

.km-nav-toggle:hover,
.km-nav-toggle[aria-expanded="true"] {
  border-color: color-mix(in srgb, var(--km-ok) 45%, transparent);
  background: color-mix(in srgb, var(--km-ok) 8%, transparent);
}

.km-nav-toggle[aria-expanded="true"] svg {
  transform: rotate(180deg);
}

.km-nav-group :is(a, button):focus-visible {
  outline: 2px solid var(--km-ring);
  outline-offset: 3px;
}

.km-sub {
  position: absolute;
  z-index: 50;
  top: calc(100% + 14px);
  left: -16px;
  display: grid;
  min-width: 248px;
  box-sizing: border-box;
  margin: 0;
  padding: 6px;
  border: 1px solid color-mix(in srgb, var(--km-ok) 30%, var(--km-line));
  border-top-color: var(--km-ok);
  background: var(--km-solid);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  box-shadow: 0 14px 32px rgba(0, 0, 0, .4), 0 0 24px color-mix(in srgb, var(--km-ok) 10%, transparent);
  font-family: "Roboto Mono", ui-monospace, monospace;
  list-style: none;
  opacity: 0;
  transform: translateY(-4px);
  visibility: hidden;
  transition: opacity .15s ease, transform .15s ease, visibility 0s linear .15s;
}

:root[data-theme="light"] .km-sub {
  box-shadow: 0 14px 32px rgba(23, 34, 48, .14);
}

/* Hover bridge across the gap between the item and the panel. */
.km-sub::before {
  position: absolute;
  inset: -16px 0 auto;
  height: 16px;
  content: '';
}

.km-nav-group.is-open > .km-sub {
  opacity: 1;
  transform: none;
  visibility: visible;
  transition-delay: 0s;
}

.km-sub a {
  position: relative;
  display: flex;
  min-height: 40px;
  box-sizing: border-box;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  color: var(--km-muted);
  font-size: 11px;
  letter-spacing: .2em;
  text-decoration: none;
  text-transform: uppercase;
  white-space: nowrap;
  transition: color .15s ease, background-color .15s ease;
}

.km-sub a span {
  color: var(--km-ok);
  letter-spacing: .1em;
}

.km-sub a:hover {
  background: color-mix(in srgb, var(--km-ok) 8%, transparent);
  color: var(--km-fg);
}

/* Current page: foreground text and the status-green bar with glow. */
.km-sub a[aria-current] {
  background: color-mix(in srgb, var(--km-ok) 11%, transparent);
  color: var(--km-fg);
  font-weight: 700;
}

.km-sub a[aria-current]::before {
  position: absolute;
  inset: 8px auto 8px 0;
  width: 2px;
  background: var(--km-ok);
  box-shadow: 0 0 8px var(--km-ok);
  content: '';
}

.km-sub a:focus-visible {
  outline-offset: -2px;
}

@media (max-width: 720px) {
  .km-nav-group { flex-wrap: wrap; }
  .km-nav-group.is-open { flex-basis: 100%; }

  .km-sub {
    position: static;
    display: none;
    width: 100%;
    min-width: 0;
    margin: 4px 0 2px 2px;
    padding: 0 0 0 12px;
    border: 0;
    border-left: 1px solid color-mix(in srgb, var(--km-ok) 45%, transparent);
    background: none;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    box-shadow: none;
    opacity: 1;
    transform: none;
    visibility: visible;
    transition: none;
  }

  :root[data-theme="light"] .km-sub { box-shadow: none; }
  .km-sub::before { display: none; }
  .km-nav-group.is-open > .km-sub { display: grid; }
  .km-sub a { min-height: 44px; }
}

@media (prefers-reduced-motion: reduce) {
  .km-sub,
  .km-nav-toggle,
  .km-nav-toggle svg { transition: none; }
}

/* ------------------------------------------------ UI/UX section pages ---- */
.uiux-page {
  --uiux-panel: rgba(2, 13, 29, .55);
}

:root[data-theme="light"] .uiux-page {
  --uiux-panel: rgba(255, 255, 255, .88);
}

.uiux-content {
  position: relative;
  max-width: 1200px;
  box-sizing: border-box;
  margin: 0 auto;
  padding: 40px 20px 96px;
  color: var(--km-muted);
  font-family: "Roboto Mono", ui-monospace, monospace;
  font-size: 14px;
  line-height: 1.75;
}

.uiux-intro {
  max-width: 860px;
  margin-bottom: 48px;
}

.uiux-eyebrow {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 0;
  font-size: 11px;
  letter-spacing: .3em;
  line-height: 1.5;
  text-transform: uppercase;
}

.uiux-eyebrow-rule {
  width: 64px;
  height: 1px;
  flex: none;
  background: color-mix(in srgb, var(--km-ok) 50%, transparent);
}

.uiux-eyebrow-trail {
  color: var(--km-ok);
  font-weight: 700;
}

.uiux-intro h1 {
  margin: 28px 0 0;
  color: var(--km-fg);
  font-size: clamp(2.25rem, 1.6rem + 2.4vw, 3rem);
  font-weight: 700;
  letter-spacing: -.025em;
  line-height: 1.15;
}

/* Focused after in-page navigation; it is not a control. */
.uiux-intro h1:focus {
  outline: none;
}

.uiux-intro h1 em {
  color: var(--km-ok);
  font-style: normal;
  text-shadow: 0 0 30px color-mix(in srgb, var(--km-ok) 35%, transparent);
}

.uiux-lead {
  max-width: 640px;
  margin: 20px 0 0;
}

.uiux-card {
  border: 1px solid color-mix(in srgb, var(--km-line) 70%, transparent);
  background: var(--uiux-panel);
}

.uiux-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
  gap: 16px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.uiux-card {
  display: flex;
  height: 100%;
  box-sizing: border-box;
  flex-direction: column;
  gap: 8px;
  padding: 24px;
  color: var(--km-muted);
  text-decoration: none;
  transition: transform 150ms cubic-bezier(.4, 0, .2, 1), border-color 150ms ease, box-shadow 150ms ease;
}

.uiux-card:hover {
  border-color: var(--km-ok);
  box-shadow: 0 0 24px color-mix(in srgb, var(--km-ok) 18%, transparent);
  transform: translateY(-2px);
}

.uiux-card:focus-visible {
  outline: 2px solid var(--km-ring);
  outline-offset: 3px;
}

.uiux-card-num {
  color: var(--km-ok);
  font-size: 11px;
  letter-spacing: .3em;
}

.uiux-card-title {
  color: var(--km-fg);
  font-size: 1.375rem;
  font-weight: 700;
  line-height: 1.3;
}

.uiux-card-go {
  margin-top: auto;
  padding-top: 8px;
  color: var(--km-ok);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
}

@media (prefers-reduced-motion: reduce) {
  .uiux-card { transition: none; }
  .uiux-card:hover { transform: none; }
}

/* Shared header layout (homepage and app pages). */
nav[aria-label="Primary"] > ul {
  min-width: 0;
  max-width: 100%;
  flex-wrap: wrap;
  overflow: visible;
}

@media (max-width: 720px) {
  nav[aria-label="Primary"] { grid-template-columns: 1fr; }
  nav[aria-label="Primary"] > a { justify-self: start; }
  nav[aria-label="Primary"] > ul { justify-content: flex-start; gap: .6rem 1rem; }
}

/* Backdrop fixed to the viewport while the page content scrolls. */
.uiux-page::before,
.uiux-page::after {
  position: fixed;
  z-index: -1;
  inset: -1px;
  pointer-events: none;
  content: '';
}

.uiux-page::before {
  background-color: var(--uiux-bg);
  background-image:
    radial-gradient(ellipse at 72% 44%, var(--uiux-glow), transparent 56%),
    linear-gradient(var(--uiux-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--uiux-grid) 1px, transparent 1px),
    repeating-linear-gradient(180deg, var(--uiux-scan) 0 1px, transparent 1px 4px);
  background-size: auto, 40px 40px, 40px 40px, auto;
}

.uiux-page::after {
  inset: -48%;
  background: conic-gradient(from 0deg at 50% 50%, transparent 0deg 337deg, var(--uiux-sweep) 350deg, transparent 360deg);
  opacity: .58;
  transform-origin: center;
  -webkit-mask-image: radial-gradient(ellipse at center, transparent 0 9%, #000 22% 76%, transparent 96%);
  mask-image: radial-gradient(ellipse at center, transparent 0 9%, #000 22% 76%, transparent 96%);
  animation: asd-background-sweep 240s linear infinite;
}

:root[data-theme="light"] .uiux-page {
  background-color: #f6f9fb;
  --uiux-bg: #f6f9fb;
  --uiux-grid: rgba(0, 93, 117, .1);
  --uiux-glow: rgba(0, 93, 117, .08);
  --uiux-scan: rgba(0, 93, 117, .025);
  --uiux-sweep: rgba(0, 107, 83, .1);
  --uiux-border: #668093;
  --uiux-fg: #172a35;
  --uiux-muted: #38566a;
  --uiux-accent: #096b4a;
  --uiux-focus: #005d75;
}

/* Header tools: the DAY / NIGHT switch group (the switch itself is the design
   system's ThemeSwitch, .ds-theme-switch in src/design-system/styles). */
.asd-header-tools {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Placement: top-right cell of the header grid, beside the UTC clock. */
nav[aria-label="Primary"] > .asd-header-tools {
  grid-row: 1;
  grid-column: 3;
  justify-self: end;
}

@media (min-width: 768px) {
  /* The UTC clock shares that cell (pinned, so it isn't pushed to a new row);
     its margin keeps it clear of the switch. */
  nav[aria-label="Primary"] > div:not(.asd-header-tools) {
    grid-row: 1;
    grid-column: 3;
    margin-right: calc(var(--asd-mode-w, 110px) + 16px);
    white-space: nowrap;
  }
}

@media (max-width: 720px) {
  /* Stacked header: the switch shares the logo row, at the right. Both are
     pinned to that row so neither displaces the other. */
  nav[aria-label="Primary"] > a:first-child,
  nav[aria-label="Primary"] > .asd-header-tools {
    grid-row: 1;
    grid-column: 1;
  }
}

.portfolio-error {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: #020d1d;
  color: #dceaf3;
  padding: 1.5rem;
  font: 500 .875rem/1.6 "Roboto Mono", ui-monospace, monospace;
  text-align: center;
}

.portfolio-frame {
  position: fixed;
  inset: 0;
  background: #020d1d;
}

:root[data-theme="light"] .portfolio-error {
  background: #f6f9fb;
  color: #172a35;
}

:root[data-theme="light"] .portfolio-frame {
  background: #f6f9fb;
}

@media (prefers-reduced-motion: reduce) {
  .uiux-page::after { animation: none; }
}

.auth-shell {
  min-height: 100svh;
  width: 100%;
  box-sizing: border-box;
  position: relative;
  isolation: isolate;
  overflow: hidden;
  display: grid;
  place-items: center;
  padding: 1.5rem 1.25rem;
  background:
    radial-gradient(ellipse at 50% 45%, rgba(20, 110, 150, .28), transparent 62%),
    linear-gradient(rgba(70, 200, 220, .07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(70, 200, 220, .07) 1px, transparent 1px),
    var(--auth-bg);
  background-size: auto, 48px 48px, 48px 48px, auto;
  --auth-bg: #020d1d;
  --auth-card: #061b2c;
  --auth-fg: #dceaf3;
  --auth-muted: #9fb7cc;
  --auth-primary: #2beea0; /* homepage --primary */
  --auth-primary-fg: #071322;
  --auth-border: #506f83;
  --auth-destructive: #ff6675;
  --auth-sel: #47c9d5;
  --auth-radius: 4px;
  color: var(--auth-fg);
  font-family: "Roboto Mono", ui-monospace, monospace;
}

:root[data-theme="light"] .auth-shell {
  --auth-bg: #f6f9fb;
  --auth-card: #fff;
  --auth-fg: #172a35;
  --auth-muted: #38566a;
  --auth-primary: #0a6b4b; /* homepage --primary (light) */
  --auth-primary-fg: #fff;
  --auth-border: #668093;
  --auth-destructive: #a31d30;
  --auth-sel: #005d75;
  background:
    radial-gradient(ellipse at 50% 45%, rgba(0, 93, 117, .08), transparent 62%),
    linear-gradient(rgba(0, 93, 117, .065) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 93, 117, .065) 1px, transparent 1px),
    var(--auth-bg);
}

.auth-frame {
  width: min(100%, 1080px);
  min-height: calc(100svh - 3rem);
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  gap: 1.25rem;
  padding-top: 65px; /* clear of the shared site header */
  box-sizing: border-box;
}

.auth-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.auth-footer {
  align-self: end;
}

.auth-card {
  position: relative;
  align-self: center;
  width: 100%;
  max-width: 460px;
  justify-self: center;
  box-sizing: border-box;
  overflow: hidden;
  border: 1px solid var(--auth-border);
  border-radius: var(--auth-radius);
  background:
    radial-gradient(ellipse at 100% 0%, rgba(20, 110, 150, .16), transparent 44%),
    var(--auth-card);
  box-shadow: 0 24px 70px rgba(0, 0, 0, .34), 0 0 48px rgba(32, 212, 174, .055);
  padding: clamp(1.25rem, 5vw, 2.25rem);
}

:root[data-theme="light"] .auth-card {
  background:
    radial-gradient(ellipse at 100% 0%, rgba(0, 93, 117, .06), transparent 44%),
    var(--auth-card);
}


.auth-card::before {
  position: absolute;
  inset: 0 0 auto;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--auth-primary) 38%, var(--auth-sel) 72%, transparent);
  content: '';
}

.auth-live {
  display: flex;
  align-items: center;
  gap: .75rem;
  color: var(--auth-muted);
  font-size: .625rem;
  font-weight: 500;
  letter-spacing: .12em;
}

.auth-card-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
  margin-bottom: 1.25rem;
}

.auth-kicker {
  color: var(--auth-primary);
  font-size: .625rem;
  font-weight: 700;
  letter-spacing: .18em;
}

.auth-live {
  gap: .4rem;
  white-space: nowrap;
}

.auth-live span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--auth-primary);
  box-shadow: 0 0 8px var(--auth-primary);
}

.auth-card h1 {
  margin: 0;
  font-size: clamp(1.65rem, 5vw, 2rem);
  line-height: 1.2;
  letter-spacing: -.055em;
  color: var(--auth-fg);
}

.auth-heading-mark {
  color: var(--auth-primary);
}

.auth-subtitle {
  margin: .5rem 0 1.75rem;
  color: var(--auth-muted);
  font-size: .8125rem;
  line-height: 1.6;
}

.auth-field {
  display: grid;
  gap: .5rem;
  margin-bottom: 1rem;
}

.auth-field label,
.auth-label-row label {
  color: var(--auth-fg);
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.auth-label-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.auth-field input {
  width: 100%;
  min-height: 44px;
  box-sizing: border-box;
  border: 1px solid var(--auth-border);
  border-radius: var(--auth-radius);
  background: var(--auth-bg);
  color: var(--auth-fg);
  padding: .75rem;
  font-family: inherit;
  font-size: .875rem;
  outline: none;
}

.auth-field input:focus-visible {

  box-shadow: 0 0 0 3px rgba(71, 201, 213, .28);
}

.auth-field input[aria-invalid="true"] {
  border-color: var(--auth-destructive);
}

.auth-error,
.auth-submit-error {
  color: var(--auth-destructive);
  font-size: .75rem;
  line-height: 1.45;
}

.auth-submit-error {
  border-left: 2px solid var(--auth-destructive);
  background: rgba(255, 102, 117, .08);
  margin: 0 0 1rem;
  padding: .75rem;
}

.auth-options {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin: .25rem 0 1.25rem;

}

.auth-checkbox {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  color: var(--auth-muted);
  cursor: pointer;
}

.auth-checkbox input {
  width: 16px;
  height: 16px;
  accent-color: var(--auth-primary);
}

/* WCAG 2.4.7 / 1.4.11: the native checkbox ring was ~1.1:1 on the card. */
.auth-checkbox input:focus-visible {
  outline: 2px solid var(--auth-sel);
  outline-offset: 2px;
}

.auth-text-button {
  border: 0;
  background: transparent;
  color: var(--auth-sel);
  padding: .25rem 0;
  font-family: inherit;
  font-size: .75rem;
  cursor: pointer;
  text-underline-offset: 3px;
}

.auth-text-button:hover:not(:disabled) {
  text-decoration: underline;
}

.auth-text-button:focus-visible,
.auth-submit:focus-visible {
  outline: 2px solid var(--auth-sel);
  outline-offset: 3px;
}

.auth-submit {
  min-height: 48px;
  width: 100%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .625rem;
  border: 1px solid var(--auth-primary);
  border-radius: 0;
  background: var(--auth-primary);
  box-shadow: 0 0 24px color-mix(in srgb, var(--auth-primary) 35%, transparent);
  color: var(--auth-primary-fg);
  padding: .75rem 1.75rem;
  font-family: inherit;
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;

  transition: transform 150ms cubic-bezier(.4, 0, .2, 1), box-shadow 150ms cubic-bezier(.4, 0, .2, 1);
}

.auth-submit:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 0 32px color-mix(in srgb, var(--auth-primary) 55%, transparent);
}

.auth-submit:active:not(:disabled) {
  transform: none;

.auth-submit:disabled {
  cursor: wait;

.auth-form-actions {
