}

.auth-secondary-button {
  min-height: 44px;
  border: 1px solid var(--auth-primary);
  border-radius: 0;
  background: color-mix(in srgb, var(--auth-primary) 5%, transparent);
  color: var(--auth-primary);
  padding: .625rem .75rem;
  font-family: inherit;
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  cursor: pointer;
  transition: transform 150ms cubic-bezier(.4, 0, .2, 1), background 150ms ease;
}

.auth-secondary-button:hover:not(:disabled) {
  transform: translateY(-2px);
  background: color-mix(in srgb, var(--auth-primary) 15%, transparent);
}

.auth-secondary-button:active:not(:disabled) {
  transform: none;
}

.auth-secondary-button:focus-visible {
  outline: 2px solid var(--auth-sel);
  outline-offset: 3px;
}

.auth-secondary-button:disabled {
  cursor: wait;
  opacity: 1;
}

.auth-field input:disabled {
  opacity: 1;
}

.auth-spinner {
  width: 14px;
  height: 14px;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: 9999px;
  animation: auth-spin .75s linear infinite;
}

.auth-card-footer {
  display: flex;
  justify-content: space-between;
  gap: .75rem;
  border-top: 1px solid rgba(90, 170, 210, .18);
  margin-top: 1.5rem;
  padding-top: .875rem;
  color: var(--auth-muted);
  font-size: .5625rem;
  letter-spacing: .14em;
}

:root[data-theme="light"] .auth-card-footer {
  border-top-color: var(--auth-border);
}

.auth-footer {
  color: var(--auth-muted);
  font-size: .5625rem;
  letter-spacing: .1em;
}

@keyframes auth-spin {
  to { transform: rotate(360deg); }
}

@media (max-width: 420px) {
  .auth-shell {
    padding: 1rem;
  }

  .auth-frame {
    min-height: calc(100svh - 2rem);
    gap: 1rem;
  }

  .auth-card {
    padding: 1.25rem;
  }

  .auth-options {
    align-items: flex-start;
  }

  .auth-footer {
    font-size: .5rem;
  }

  .auth-footer {
    flex-wrap: wrap;
  }
}

@media (prefers-reduced-motion: reduce) {
  .auth-spinner { animation-duration: 1.5s; }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --background: 216 85% 7%;
  --foreground: 210 35% 93%;
  --card: 216 70% 10%;
  --card-foreground: 210 35% 93%;
  --primary: 156 85% 55%;
  --primary-foreground: 214 66% 8%;
  --secondary: 213 45% 18%;
  --secondary-foreground: 210 35% 93%;
  --muted: 213 35% 18%;
  --muted-foreground: 212 20% 75%;
  --accent: 170 40% 20%;
  --accent-foreground: 160 60% 88%;
  --destructive: 354 75% 78%;
  --destructive-foreground: 214 66% 8%;
  --border: 205 35% 55%;
  --input: 205 35% 55%;
  --ring: 190 90% 60%;
  --ok: 156 85% 55%;
  --sel: 190 90% 60%;
  --caut: 42 100% 65%;
  --warn: 354 75% 78%;
  --coord: 283 80% 78%;
}

:root[data-theme="light"] {
  color-scheme: light;
  --background: 210 30% 97%;
  --foreground: 213 35% 14%;
  --card: 0 0% 100%;
  --card-foreground: 213 35% 14%;
  --primary: 160 83% 23%;
  --primary-foreground: 0 0% 100%;
  --secondary: 203 25% 90%;
  --secondary-foreground: 213 35% 14%;
  --muted: 203 24% 92%;
  --muted-foreground: 204 32% 30%;
  --accent: 160 35% 88%;
  --accent-foreground: 164 65% 20%;
  --destructive: 354 75% 35%;
  --destructive-foreground: 0 0% 100%;
  --border: 205 18% 48%;
  --input: 205 18% 48%;
  --ring: 195 100% 28%;
  --ok: 160 83% 23%;
  --sel: 195 100% 28%;
  --caut: 36 95% 28%;
  --warn: 354 75% 35%;
  --coord: 280 72% 38%;
}

:root[data-theme="light"] body {
  background: hsl(var(--background));
  color: hsl(var(--foreground));
}

:root[data-theme="dark"] body {
  background: hsl(var(--background));
  color: hsl(var(--foreground));
}

:root[data-theme] input,
:root[data-theme] textarea,
:root[data-theme] select {
  color: hsl(var(--foreground));
}

:root[data-theme="light"] ::placeholder {
  color: hsl(var(--muted-foreground));
  opacity: 1;
}

:root[data-theme] :disabled {
  opacity: 1;
  cursor: not-allowed;
}

:where(:root[data-theme]) :where([class~="border"], [class~="border-y"], [class~="border-b"], [class~="border-l-2"], [class~="border-l-4"], [class~="border-r"]) {
  border-color: hsl(var(--border));
}

:root[data-theme] [class~="border-caut/40"] {
  border-color: hsl(var(--caut));
}

:root[data-theme] [class~="border-coord/40"] {
  border-color: hsl(var(--coord));
}

:root[data-theme] [class~="border-ok/10"],
:root[data-theme] [class~="border-ok/15"],
:root[data-theme] [class~="border-ok/40"],
:root[data-theme] [class~="border-ok/50"] {
  border-color: hsl(var(--ok));
}

:root[data-theme] [class~="border-primary/50"] {
  border-color: hsl(var(--primary));
}

:root[data-theme] [class~="border-sel/40"] {
  border-color: hsl(var(--sel));
}

:root[data-theme] [class~="border-warn/40"] {
  border-color: hsl(var(--warn));
}

:root[data-theme] .band-grid + .band-dark,
:root[data-theme] .band-dark + .band-grid,
:root[data-theme] .band-grid + .band-grid,
:root[data-theme] .band-dark + .band-dark {
  border-top-color: hsl(var(--border));
}

:root[data-theme] [class~="hover:border-ok/50"]:hover,
:root[data-theme] [class~="hover:border-ok/60"]:hover {
  border-color: hsl(var(--ok));
}

:root[data-theme] [class~="text-ok/80"] {
  color: hsl(var(--ok));
}

:root[data-theme="light"] .band-grid {
  background:
    linear-gradient(rgba(0, 93, 117, .07) 1px, transparent 1px) 0 0 / 48px 48px,
    linear-gradient(90deg, rgba(0, 93, 117, .07) 1px, transparent 1px) 0 0 / 48px 48px,
    radial-gradient(900px 420px at 50% 0%, rgba(0, 93, 117, .09), transparent 70%),
    linear-gradient(180deg, #edf4f7, #f6f9fb);
}

:root[data-theme="light"] .band-dark {
  background: radial-gradient(700px 500px at 100% 100%, rgba(0, 93, 117, .07), transparent 70%), #eaf1f4;
}

:root[data-theme="light"] .band-grid + .band-dark,
:root[data-theme="light"] .band-dark + .band-grid,
:root[data-theme="light"] .band-grid + .band-grid,
:root[data-theme="light"] .band-dark + .band-dark {
  border-top-color: #708995;
}

:root[data-theme="light"] #top.asd-hero {
  background-color: #eaf1f4;
}

:root[data-theme="light"] #top.asd-hero::before {
  background-image:
    radial-gradient(ellipse at 72% 44%, rgba(0, 93, 117, .08), transparent 56%),
    linear-gradient(rgba(0, 93, 117, .09) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 93, 117, .09) 1px, transparent 1px),
    repeating-linear-gradient(180deg, rgba(0, 93, 117, .025) 0 1px, transparent 1px 4px);
}

:root[data-theme] [class~="border-[#1f4a66]/80"] {
  border-color: hsl(var(--border));
}

:root[data-theme="light"] [class~="bg-[#020d1d]/60"] {
  background-color: rgb(255 255 255 / .92);
}

:root[data-theme="light"] [class~="bg-[#030f22]/90"] {
  background-color: rgb(255 255 255 / .96);
}

:root[data-theme="light"] [class~="bg-[#03112a]/70"] {
  background-color: rgb(255 255 255 / .88);
}

:root[data-theme="light"] [class~="bg-black/40"] {
  border: 1px solid #096b4a;
  background-color: #fff;
}

/* Gradient headline text: both stops stay solid (≥4.5:1) instead of fading to transparent. */
:root[data-theme="light"] [class~="from-[#c8f7e2]"] {
  --tw-gradient-from: #005d75 var(--tw-gradient-from-position);
  --tw-gradient-to: hsl(var(--ok)) var(--tw-gradient-to-position);
  --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to);
}

/*
 * Hero bottom fade sits above the hero content. At full height its white wash
 * covered the CTA buttons (white-on-green text fell below 4.5:1), so in light
 * mode it only blends the last strip into the ticker.
 */
:root[data-theme="light"] [class~="to-[#020e22]/90"] {
  --tw-gradient-to: rgb(255 255 255 / .94) var(--tw-gradient-to-position);
  height: 4.5rem;
}

:root[data-theme="light"] [class~="text-[#9fb7cc]"] {
  --tw-text-opacity: 1;
  color: #35556a;
}

:root[data-theme="light"] #console [fill="#03201a"],
:root[data-theme="light"] #console [fill="#032019"],
:root[data-theme="light"] #work [fill="#03201a"],
:root[data-theme="light"] #work [fill="#032019"],
:root[data-theme="light"] #work [fill="#010d0d"] {
  fill: #f1f6f7;
}

:root[data-theme="light"] #console [stop-color="#0f4d68"],
:root[data-theme="light"] #work [stop-color="#0f4d68"] {
  stop-color: #d7e8ee;
}

:root[data-theme="light"] #console [stop-color="#0a2b49"],
:root[data-theme="light"] #work [stop-color="#0a2b49"] {
  stop-color: #edf4f6;
}

/*
 * Fill and stroke are remapped separately. A combined rule paints the fill onto
 * outline-only shapes (e.g. <g fill="none" stroke="#46f0a8">), which turned the
 * radar rings and sector polygons into solid blobs in light mode.
 */
:root[data-theme="light"] #console [fill="#46f0a8"],
:root[data-theme="light"] #work [fill="#46f0a8"],
:root[data-theme="light"] #work [fill="#3df08f"] {
  fill: #096b4a;
}

:root[data-theme="light"] #console [stroke="#46f0a8"],
:root[data-theme="light"] #work [stroke="#46f0a8"],
:root[data-theme="light"] #work [stroke="#3df08f"] {
  stroke: #096b4a;
}

:root[data-theme="light"] #console [fill="#e8b23a"],
:root[data-theme="light"] #work [fill="#e8b23a"] {
  fill: #835000;
}

:root[data-theme="light"] #console [stroke="#e8b23a"],
:root[data-theme="light"] #work [stroke="#e8b23a"] {
  stroke: #835000;
}

:root[data-theme="light"] #console [fill="#ff4d5e"],
:root[data-theme="light"] #work [fill="#ff4d5e"] {
  fill: #9c1624;
}

:root[data-theme="light"] #console [stroke="#ff4d5e"],
:root[data-theme="light"] #work [stroke="#ff4d5e"] {
  stroke: #9c1624;
}

/* Live prototype sweep: the dark-mode mint wedge washes out light backgrounds. */
:root[data-theme="light"] #console [style*="rgba(70,240,168"],
:root[data-theme="light"] #console [style*="rgba(70, 240, 168"] {
  background: conic-gradient(from 0deg, transparent 0deg 250deg, rgba(0, 107, 74, .24) 360deg) !important;
}

/*
 * Live prototype flight list: framer-motion animates an inline dark
 * backgroundColor, which left dark text on slate (≈1.4–2.6:1). Override it.
 */
:root[data-theme="light"] #console button[class~="border-l-4"] {
  background-color: hsl(var(--card)) !important;
  color: hsl(var(--foreground));
}

:root[data-theme="light"] #console button[class~="border-l-4"]:hover {
  background-color: hsl(var(--accent)) !important;
}

:root[data-theme="light"] #console button[class~="border-l-warn"] {

  color: #7a0f1b;
}

:root[data-theme="light"] #console button[class~="border-l-4"]:focus-visible {
  outline: 2px solid hsl(var(--ring));
  outline-offset: 2px;
}

:root[data-theme="light"] #console [fill="#cfe4f2"],
:root[data-theme="light"] #work [fill="#cfe4f2"] {
  fill: #172230;
}

:root[data-theme="light"] #console text,
:root[data-theme="light"] #work [aria-label="Radar HMI screenshot"] text,
:root[data-theme="light"] #work [aria-label="Flight strip HMI screenshot"] text {

}

:root[data-theme="light"] #work [aria-label="Radar HMI screenshot"] stop[stop-color="#000"],
